# Sitio estático: la carpeta raíz se publica tal cual.
[build]
  publish = "."
  command = ""

# www y el subdominio de Netlify llevan al dominio principal
[[redirects]]
  from = "https://www.crdigitalar.com/*"
  to = "https://crdigitalar.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://crdigital.netlify.app/*"
  to = "https://crdigitalar.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
